<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Точка Плавления — Выбор Варианта Дизайна</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%; font-family: 'Hanken Grotesk', sans-serif; background: #1c1c1c; color: #fff;
    }
    .switcher-header {
      background: #111111; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #fc6c2b;
      font-family: 'IBM Plex Mono', monospace; font-size: 14px;
    }
    .switcher-header .title { font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .switcher-header .title span { color: #fc6c2b; }
    .btn-group { display: flex; gap: 10px; }
    .btn-v {
      background: #222; color: #fff; padding: 6px 16px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: 600; transition: all 0.2s; border: 1px solid #444;
    }
    .btn-v.active, .btn-v:hover { background: #fc6c2b; border-color: #fc6c2b; color: #fff; }
    iframe { width: 100%; height: calc(100vh - 54px); border: none; }
  </style>
</head>
<body>

  <div class="switcher-header">
    <div class="title">
      <span>⊕</span> ТОЧКА ПЛАВЛЕНИЯ — ВЫБОР ДИЗАЙН-КОНЦЕПЦИИ
    </div>
    <div class="btn-group">
      <a href="variant3.html" target="preview-frame" class="btn-v active" onclick="setActive(this)">★ Точная Копия Референса TochkiCamp</a>
      <a href="variant_masterpiece.html" target="preview-frame" class="btn-v" onclick="setActive(this)">Вариант Идеал (Multi-Palette)</a>
      <a href="variant1.html" target="preview-frame" class="btn-v" onclick="setActive(this)">Вариант 1 (Классика)</a>
    </div>
  </div>

  <iframe name="preview-frame" src="variant3.html"></iframe>

  <script>
    function setActive(el) {
      document.querySelectorAll('.btn-v').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }
  </script>
</body>
</html>
