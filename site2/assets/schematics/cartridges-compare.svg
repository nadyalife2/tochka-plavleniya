<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="100%" height="100%" fill="none">
  <!-- Clean technical background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Subtle technical grid -->
  <defs>
    <pattern id="ink-grid-2" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 14 0 L 0 0 0 14" fill="none" stroke="#e2e8f0" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#ink-grid-2)"/>

  <!-- CARTRIDGE 1: HAKKO T12 (Top) -->
  <g id="cartridge-t12">
    <!-- Header / Label -->
    <text x="18" y="22" font-family="Consolas, ui-monospace, monospace" font-size="12" font-weight="bold" fill="#0f172a">A: HAKKO T12 (70 Вт)</text>
    <text x="210" y="22" font-family="Consolas, ui-monospace, monospace" font-size="10" font-weight="700" fill="#64748b">Вынос ~45 мм</text>

    <!-- Tube Body -->
    <rect x="18" y="30" width="160" height="18" rx="1" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
    
    <!-- Contact rings (2 contacts) -->
    <rect x="20" y="32" width="16" height="14" fill="#e2e8f0" stroke="#0f172a" stroke-width="0.9"/>
    <line x1="36" y1="30" x2="36" y2="48" stroke="#0f172a" stroke-width="1.8"/>
    <rect x="40" y="32" width="20" height="14" fill="#e2e8f0" stroke="#0f172a" stroke-width="0.9"/>
    <line x1="60" y1="30" x2="60" y2="48" stroke="#0f172a" stroke-width="1.8"/>

    <!-- Plastic spacer -->
    <rect x="110" y="28" width="8" height="22" rx="1" fill="#334155" stroke="#0f172a" stroke-width="1.4"/>

    <!-- Tip Cone -->
    <path d="M 178 32 L 235 36 L 246 39 L 235 42 L 178 46 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Working pre-tinned face -->
    <polygon points="230,36 246,39 230,42" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.2"/>

    <!-- Internal Coil schematic (dotted) -->
    <path d="M 145 39 Q 150 35, 155 39 T 165 39 T 175 39 T 185 39" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="2.5 1.5"/>

    <!-- Dimension & Leader -->
    <line x1="178" y1="53" x2="246" y2="53" stroke="#0f172a" stroke-width="0.9"/>
    <line x1="178" y1="50" x2="178" y2="56" stroke="#0f172a" stroke-width="0.9"/>
    <line x1="246" y1="50" x2="246" y2="56" stroke="#0f172a" stroke-width="0.9"/>
    <text x="212" y="64" font-family="Consolas, ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">L = 45 мм</text>
  </g>

  <!-- Divider Dashed Line -->
  <line x1="18" y1="80" x2="322" y2="80" stroke="#cbd5e1" stroke-dasharray="4 3" stroke-width="1"/>

  <!-- CARTRIDGE 2: JBC C245 (Bottom) -->
  <g id="cartridge-c245">
    <!-- Header / Label -->
    <text x="18" y="98" font-family="Consolas, ui-monospace, monospace" font-size="12" font-weight="bold" fill="#0f172a">B: JBC C245 (130 Вт)</text>
    <text x="205" y="98" font-family="Consolas, ui-monospace, monospace" font-size="10" font-weight="700" fill="#0f172a">Вынос ~18 мм [FAST]</text>

    <!-- Tube Body (thicker, high-grade stainless) -->
    <rect x="18" y="106" width="195" height="19" rx="1" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>

    <!-- 3 Gold-plated Contact Rings -->
    <rect x="22" y="108" width="18" height="15" fill="#e2e8f0" stroke="#0f172a" stroke-width="0.9"/>
    <rect x="46" y="108" width="18" height="15" fill="#e2e8f0" stroke="#0f172a" stroke-width="0.9"/>
    <rect x="70" y="108" width="18" height="15" fill="#e2e8f0" stroke="#0f172a" stroke-width="0.9"/>
    <line x1="42" y1="106" x2="42" y2="125" stroke="#0f172a" stroke-width="2"/>
    <line x1="66" y1="106" x2="66" y2="125" stroke="#0f172a" stroke-width="2"/>
    <line x1="90" y1="106" x2="90" y2="125" stroke="#0f172a" stroke-width="2"/>

    <!-- Short Heavy-duty Tip Cone -->
    <path d="M 213 108 L 250 112 L 258 115.5 L 250 119 L 213 123 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Working face -->
    <polygon points="244,112 258,115.5 244,119" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.2"/>

    <!-- Integrated TC sensor right at the apex -->
    <circle cx="253" cy="115.5" r="2.5" fill="#0f172a"/>

    <!-- Dimension & Comparison -->
    <line x1="213" y1="129" x2="258" y2="129" stroke="#0f172a" stroke-width="1"/>
    <line x1="213" y1="126" x2="213" y2="132" stroke="#0f172a" stroke-width="1"/>
    <line x1="258" y1="126" x2="258" y2="132" stroke="#0f172a" stroke-width="1"/>
    <text x="235" y="141" font-family="Consolas, ui-monospace, monospace" font-size="9.5" font-weight="bold" fill="#0f172a" text-anchor="middle">L = 18 мм</text>
  </g>

  <!-- Side Technical Note Box -->
  <g font-family="Consolas, ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#0f172a">
    <text x="18" y="165">C245: отклик &lt; 2 сек на сплошных полигонах</text>
  </g>
</svg>
