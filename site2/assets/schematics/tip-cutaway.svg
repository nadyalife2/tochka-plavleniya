<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="100%" height="100%" fill="none">
  <!-- Clean technical background -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Subtle technical grid -->
  <defs>
    <pattern id="ink-grid-1" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 14 0 L 0 0 0 14" fill="none" stroke="#e2e8f0" stroke-width="0.6"/>
    </pattern>
    <pattern id="hatch-cu" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#0f172a" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#ink-grid-1)"/>

  <!-- Centerline Axis (ГОСТ 2.303) -->
  <line x1="15" y1="90" x2="325" y2="90" stroke="#64748b" stroke-dasharray="10 3 2 3" stroke-width="0.8"/>

  <!-- MAIN TIP GEOMETRY (Ink drafting) -->
  <!-- Copper Core with Hatching -->
  <path d="M 40 50 L 190 50 L 260 78 L 276 88 L 276 90 L 40 90 Z" fill="url(#hatch-cu)" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Cavity: Heater & Thermocouple -->
  <rect x="40" y="68" width="100" height="22" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="122" cy="79" r="4.5" fill="#0f172a"/>
  <text x="48" y="83" font-family="Consolas, ui-monospace, monospace" font-size="9" fill="#0f172a" font-weight="700">HEATER / TC</text>

  <!-- Protective Iron Cladding (Fe) Layer -->
  <path d="M 170 47 L 263 75 L 280 87 L 280 90" fill="none" stroke="#0f172a" stroke-width="2.6"/>

  <!-- Chromium anti-creeping barrier -->
  <path d="M 40 46 L 190 46 L 220 58" fill="none" stroke="#475569" stroke-width="3"/>

  <!-- Pre-tinned working tip face (Sn) -->
  <path d="M 262 76 L 280 87 L 280 90 L 274 90 L 258 83 Z" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.4"/>

  <!-- Bottom Exterior Contour -->
  <path d="M 40 90 L 40 130 L 190 130 L 260 102 L 280 90 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Exterior lathe turning line shading -->
  <line x1="40" y1="104" x2="190" y2="104" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="40" y1="118" x2="190" y2="118" stroke="#cbd5e1" stroke-width="0.8"/>

  <!-- Left stop flange -->
  <rect x="35" y="44" width="8" height="92" rx="1" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.4"/>

  <!-- INK LEADER LINES & MONOSPACE CALLOUTS (#0f172a) -->
  <!-- 1. Медный сердечник -->
  <g font-family="Consolas, ui-monospace, monospace" fill="#0f172a">
    <circle cx="140" cy="62" r="2.5" fill="#0f172a"/>
    <polyline points="140,62 165,22 235,22" stroke="#0f172a" stroke-width="1.2" fill="none"/>
    <text x="168" y="18" font-size="11" font-weight="700">1. Медный сердечник (Cu)</text>
  </g>

  <!-- 2. Защитная гильза Fe/Cr -->
  <g font-family="Consolas, ui-monospace, monospace" fill="#0f172a">
    <circle cx="215" cy="56" r="2.5" fill="#0f172a"/>
    <polyline points="215,56 235,42 325,42" stroke="#0f172a" stroke-width="1.2" fill="none"/>
    <text x="240" y="38" font-size="11" font-weight="700">2. Гильза Fe / хром Cr</text>
  </g>

  <!-- 3. Зона лужения -->
  <g font-family="Consolas, ui-monospace, monospace" fill="#0f172a">
    <circle cx="274" cy="85" r="2.5" fill="#0f172a"/>
    <polyline points="274,85 295,115 330,115" stroke="#0f172a" stroke-width="1.2" fill="none"/>
    <text x="220" y="128" text-anchor="end" font-size="11" font-weight="700">3. Рабочая зона (Sn)</text>
  </g>

  <!-- 4. Термопара / нагреватель -->
  <g font-family="Consolas, ui-monospace, monospace" fill="#0f172a">
    <circle cx="122" cy="79" r="2.5" fill="#0f172a"/>
    <polyline points="122,79 105,148 18,148" stroke="#0f172a" stroke-width="1.2" fill="none"/>
    <text x="18" y="143" font-size="11" font-weight="700">4. Термопара / TC</text>
  </g>

  <!-- Dimension line / scale mark -->
  <g stroke="#0f172a" stroke-width="0.9" font-family="Consolas, ui-monospace, monospace" font-size="9" fill="#0f172a" font-weight="700">
    <line x1="40" y1="168" x2="280" y2="168"/>
    <line x1="40" y1="163" x2="40" y2="173"/>
    <line x1="280" y1="163" x2="280" y2="173"/>
    <text x="160" y="165" text-anchor="middle">L = 42 мм [РАЗРЕЗ A-A]</text>
  </g>
</svg>
