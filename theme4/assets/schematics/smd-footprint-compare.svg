<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="100%" height="100%" fill="none">
  <!-- Clean technical background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Subtle technical grid -->
  <defs>
    <pattern id="smd-grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 14 0 L 0 0 0 14" fill="none" stroke="#e2e8f0" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#smd-grid)"/>

  <!-- Title banner -->
  <text x="20" y="24" font-family="Consolas, ui-monospace, monospace" font-size="11" fill="#0f172a" font-weight="bold">ТОПОЛОГИЯ SMD: 0402 (1005M) VS 0603 (1608M)</text>
  <line x1="20" y1="30" x2="320" y2="30" stroke="#0f172a" stroke-width="1"/>

  <!-- Left: SMD 0603 -->
  <g transform="translate(30, 48)">
    <!-- PCB Pads -->
    <rect x="0" y="20" width="28" height="46" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="52" y="20" width="28" height="46" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.2"/>
    <!-- Component Body -->
    <rect x="14" y="24" width="52" height="38" fill="#f8fafc" stroke="#0f172a" stroke-width="1.6"/>
    <!-- Metal Terminals -->
    <rect x="14" y="24" width="14" height="38" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="52" y="24" width="14" height="38" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2"/>
    <!-- Dimensions -->
    <text x="40" y="47" font-family="Consolas, monospace" font-size="9" fill="#0f172a" font-weight="bold" text-anchor="middle">0603</text>
    <text x="40" y="82" font-family="Consolas, monospace" font-size="9.5" fill="#475569" text-anchor="middle">1.6 × 0.8 мм</text>
    <text x="40" y="96" font-family="Consolas, monospace" font-size="8.5" fill="#64748b" text-anchor="middle">Ручной монтаж: 10/10</text>
  </g>

  <!-- Right: SMD 0402 -->
  <g transform="translate(190, 56)">
    <!-- PCB Pads -->
    <rect x="0" y="16" width="18" height="30" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="36" y="16" width="18" height="30" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.2"/>
    <!-- Component Body -->
    <rect x="9" y="19" width="36" height="24" fill="#f8fafc" stroke="#0f172a" stroke-width="1.6"/>
    <!-- Metal Terminals -->
    <rect x="9" y="19" width="9" height="24" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="36" y="19" width="9" height="24" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2"/>
    <!-- Dimensions -->
    <text x="27" y="35" font-family="Consolas, monospace" font-size="8" fill="#0f172a" font-weight="bold" text-anchor="middle">0402</text>
    <text x="27" y="66" font-family="Consolas, monospace" font-size="9.5" fill="#475569" text-anchor="middle">1.0 × 0.5 мм</text>
    <text x="27" y="80" font-family="Consolas, monospace" font-size="8.5" fill="#64748b" text-anchor="middle">Под микроскопом</text>
  </g>

  <!-- Footnote -->
  <line x1="20" y1="160" x2="320" y2="160" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="20" y="172" font-family="Consolas, monospace" font-size="8.5" fill="#94a3b8">IPC-7351B STANDARD LAND PATTERN SPECIFICATION // ТЧП</text>
</svg>
