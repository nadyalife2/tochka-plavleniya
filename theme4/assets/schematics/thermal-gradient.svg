<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="100%" height="100%" fill="none">
  <!-- Clean technical background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Subtle technical grid -->
  <defs>
    <pattern id="ink-grid-tg" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 14 0 L 0 0 0 14" fill="none" stroke="#e2e8f0" stroke-width="0.6"/>
    </pattern>
    <pattern id="hatch-fr4-tg" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#ink-grid-tg)"/>

  <!-- HOT AIR NOZZLE (Top) -->
  <path d="M 125 10 L 125 32 L 140 46 L 200 46 L 215 32 L 215 10 Z" fill="#0f172a" stroke="#0f172a" stroke-width="1.2"/>
  <text x="135" y="26" font-family="Consolas, ui-monospace, monospace" font-size="9" fill="#ffffff" font-weight="bold">СОПЛО ФЕНА</text>

  <!-- AIR FLOW & THERMAL ZONE (350°C) -->
  <path d="M 140 48 L 130 75 M 155 48 L 150 75 M 170 48 L 170 75 M 185 48 L 190 75 M 200 48 L 210 75" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3 2"/>
  <rect x="230" y="44" width="85" height="16" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="236" y="56" font-family="Consolas, ui-monospace, monospace" font-size="9" font-weight="bold" fill="#b91c1c">T сопла: ~350°C</text>

  <!-- BGA COMPONENT PACKAGE -->
  <rect x="70" y="76" width="200" height="16" rx="1" fill="#1e293b" stroke="#0f172a" stroke-width="1.4"/>
  <text x="115" y="88" font-family="Consolas, ui-monospace, monospace" font-size="9.5" font-weight="bold" fill="#f8fafc">BGA ЧИП / КРИСТАЛЛ</text>

  <!-- SOLDER BALLS ROW -->
  <circle cx="85" cy="98" r="4.5" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="105" cy="98" r="4.5" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="125" cy="98" r="4.5" fill="#ef4444" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="145" cy="98" r="4.5" fill="#ef4444" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="165" cy="98" r="4.5" fill="#ef4444" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="185" cy="98" r="4.5" fill="#ef4444" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="205" cy="98" r="4.5" fill="#ef4444" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="225" cy="98" r="4.5" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="245" cy="98" r="4.5" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.2"/>

  <!-- PCB WITH THERMAL GRADIENT (Curved / Warped) -->
  <path d="M 25 106 Q 170 120 315 106 L 315 124 Q 170 138 25 124 Z" fill="url(#hatch-fr4-tg)" stroke="#0f172a" stroke-width="1.4"/>
  <text x="32" y="140" font-family="Consolas, ui-monospace, monospace" font-size="9.5" fill="#0f172a" font-weight="bold">ПЛАТА FR-4 (ПРОГИБ ΔT &gt; 80°C)</text>

  <!-- TEMPERATURE CALLOUTS -->
  <g font-family="Consolas, ui-monospace, monospace" fill="#0f172a">
    <!-- Center Solder joint temperature -->
    <polyline points="165,98 165,84 38,84" stroke="#0f172a" stroke-width="1" fill="none"/>
    <circle cx="165" cy="98" r="2" fill="#0f172a"/>
    <text x="30" y="78" font-size="9" font-weight="700" fill="#b91c1c">Центр: 220°C (Liquidus)</text>

    <!-- Edge Solder joint temperature -->
    <polyline points="245,98 245,115 285,115" stroke="#0f172a" stroke-width="1" fill="none"/>
    <circle cx="245" cy="98" r="2" fill="#0f172a"/>
    <text x="250" y="130" font-size="9" font-weight="700" fill="#2563eb">Край: 175°C (Недогрев)</text>

    <!-- Warpage indicator arrows -->
    <path d="M 170 144 L 170 162 M 166 156 L 170 162 L 174 156" stroke="#0f172a" stroke-width="1.4" fill="none"/>
    <text x="180" y="160" font-size="9" font-weight="700">Изгиб платы (Warpage)</text>
  </g>
</svg>
